apiVersion: v1
kind: Service
metadata:
  name: warpserve
  labels:
    app: warpserve
spec:
  type: ClusterIP
  selector:
    app: warpserve
  ports:
    - name: http
      port: 80
      targetPort: http
# Reach it from outside the cluster with:
#   kubectl port-forward svc/warpserve 8080:80
# then hit http://localhost:8080/healthz
